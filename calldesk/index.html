<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F2E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leads">
<meta name="mobile-web-app-capable" content="yes">
<title>Leads · Call Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* =========================================================
   DESIGN TOKENS — "Call Desk"
   Deep teal-ink base, coral "live call" accent, condensed
   display numerals for stage counts. A dialer's desk, not
   a bank ledger — distinct from the LT app's palette but
   the coral is drawn from the same family as LT's stamp-red.
========================================================= */
:root{
  --ink:#0F2E2B;
  --ink-deep:#0A211F;
  --ink-soft:#173F3B;
  --paper:#F5F3EC;
  --paper-card:#FFFFFF;
  --paper-dim:#EBE7DB;
  --text:#12211F;
  --text-soft:#5B6B67;
  --text-faint:#93A19D;
  --coral:#E8683C;
  --coral-deep:#C94F27;
  --coral-bg:#FCE7DD;
  --amber:#D9A441;
  --amber-bg:#F8ECD3;
  --teal-accent:#2E8B7E;
  --teal-bg:#DCEEEA;
  --sage:#5F8A5A;
  --sage-bg:#E1EEDE;
  --line:#DCD6C6;
  --line-soft:#E9E5D8;
  --shadow-card:0 1px 3px rgba(15,46,43,.08), 0 1px 2px rgba(15,46,43,.06);
  --shadow-float:0 10px 28px rgba(15,46,43,.22);
  --radius:16px;
  --radius-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  overscroll-behavior-y:contain;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(76px + var(--safe-bottom));
}
.display{font-family:'Barlow Condensed',-apple-system,sans-serif;font-weight:700;letter-spacing:.2px;}
.mono{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:.2px;}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
@font-face{
  font-family:'Barlow Condensed';
  src:local('Barlow Condensed SemiBold');
  font-weight:700;
}

/* ---------- Top bar — glassy, bright, glowing ---------- */
@keyframes brandGlowCoral{
  0%,100%{ text-shadow:0 0 6px rgba(232,104,60,.35), 0 0 14px rgba(232,104,60,.18); }
  50%{ text-shadow:0 0 10px rgba(232,104,60,.6), 0 0 20px rgba(232,104,60,.32); }
}
.topbar{
  position:sticky;top:0;z-index:40;
  background:
    linear-gradient(120deg, rgba(255,255,255,.75) 0%, rgba(252,231,221,.6) 45%, rgba(255,255,255,.72) 100%);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid rgba(232,104,60,.28);
  color:var(--text);
  padding:calc(14px + var(--safe-top)) 18px 16px;
  box-shadow:0 4px 24px rgba(15,46,43,.10), 0 1px 0 rgba(255,255,255,.6) inset;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  box-shadow:0 2px 10px rgba(232,104,60,.4), 0 0 0 1px rgba(255,255,255,.5) inset;
  object-fit:cover;display:block;flex-shrink:0;
}
.brand-text .t1{
  font-family:'Poppins','Outfit',-apple-system,sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.1px;
  color:#C94F27;
  animation:brandGlowCoral 3.2s ease-in-out infinite;
}
.brand-text .t2{font-size:11.5px;color:var(--text-soft);margin-top:1px;font-weight:500;}
.db-pill{
  font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;
  background:rgba(255,255,255,.55);border:1px solid rgba(232,104,60,.25);backdrop-filter:blur(6px);
  color:var(--text-soft);
  display:flex;align-items:center;gap:5px;
}
.db-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
.db-pill.live .dot{background:#2E9B5F;box-shadow:0 0 0 3px rgba(46,155,95,.25);}
.db-pill.live{color:#1F7D4A;}

/* Today strip — the signature element: a horizontal call queue */
.today-strip{margin-top:14px;}
.today-strip-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.today-strip-head h3{margin:0;font-size:12.5px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.6px;}
.today-strip-head .cnt{font-size:12px;color:var(--text-faint);}
.queue-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.queue-row::-webkit-scrollbar{display:none;}
.queue-card{
  flex:0 0 auto;width:150px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);
  border-radius:12px;padding:11px 12px;border:1px solid rgba(232,104,60,.22);
  box-shadow:0 1px 4px rgba(15,46,43,.06);
}
.queue-card .qname{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-card .qmeta{font-size:11px;color:var(--text-soft);margin-top:2px;}
.queue-card .qtag{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;}
.queue-card .qtag.overdue{background:var(--coral-bg);color:var(--coral-deep);}
.queue-card .qtag.today{background:var(--amber-bg);color:#93701F;}
.queue-empty{color:var(--text-faint);font-size:12.5px;padding:8px 2px;}

/* ---------- Page shell ---------- */
.page{padding:16px 16px 8px;}
.page-head{margin-bottom:14px;}
.page-head h2{margin:0 0 2px;font-size:21px;font-weight:700;}
.page-head p{margin:0;font-size:12.5px;color:var(--text-soft);}

.search-row{display:flex;gap:8px;margin-bottom:10px;}
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--paper-card);
  border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;flex:1;
  box-shadow:var(--shadow-card);transition:border-color .15s;
}
.searchbar.focused{border-color:var(--coral);}
.searchbar input{border:none;outline:none;background:transparent;flex:1;font-size:14px;color:var(--text);min-width:0;}
.searchbar span.ic{font-size:14px;opacity:.55;}
.search-clear{
  background:var(--paper-dim);border:none;width:20px;height:20px;border-radius:50%;
  font-size:11px;color:var(--text-soft);display:none;align-items:center;justify-content:center;flex:0 0 auto;
}
.search-clear.show{display:flex;}
.sort-trigger{
  flex:0 0 auto;width:42px;background:var(--paper-card);border:1.5px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow-card);position:relative;
}
.sort-trigger.active-filter::after{
  content:'';position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral);
}
.search-meta{font-size:11.5px;color:var(--text-faint);margin:-4px 0 10px 2px;}
.search-meta b{color:var(--text-soft);}

/* ---------- Pipeline stage rail (Kanban) ---------- */
.stage-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
.stage-rail::-webkit-scrollbar{display:none;}
.stage-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;
  background:var(--paper-card);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-soft);
  cursor:pointer;white-space:nowrap;
}
.stage-chip .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
  background:var(--paper-dim);color:var(--text-soft);min-width:20px;height:20px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;}
.stage-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.stage-chip.active .n{background:rgba(255,255,255,.18);color:#fff;}

/* ---------- Lead card ---------- */
.lead-card{
  background:var(--paper-card);border-radius:var(--radius);box-shadow:var(--shadow-card);
  margin-bottom:11px;overflow:hidden;border-left:4px solid var(--line);
}
.lead-card.st-new{border-left-color:var(--teal-accent);}
.lead-card.st-contacted{border-left-color:var(--amber);}
.lead-card.st-interested{border-left-color:var(--coral);}
.lead-card.st-followup{border-left-color:var(--coral-deep);}
.lead-card.st-converted{border-left-color:var(--sage);}
.lead-card.st-lost{border-left-color:var(--text-faint);opacity:.72;}
.lead-card-body{padding:13px 14px;}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.lc-name{font-size:15.5px;font-weight:700;margin:0 0 2px;}
.lc-sub{font-size:12.5px;color:var(--text-soft);}
.lc-sub a{text-decoration:none;color:var(--text-soft);}
.stagepill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.stagepill.st-new{background:var(--teal-bg);color:var(--teal-accent);}
.stagepill.st-contacted{background:var(--amber-bg);color:#93701F;}
.stagepill.st-interested{background:var(--coral-bg);color:var(--coral-deep);}
.stagepill.st-followup{background:var(--coral-bg);color:var(--coral-deep);}
.stagepill.st-converted{background:var(--sage-bg);color:var(--sage);}
.stagepill.st-lost{background:var(--paper-dim);color:var(--text-faint);}
.lc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tag{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--paper-dim);color:var(--text-soft);}
.tag.warn{background:var(--coral-bg);color:var(--coral-deep);}
.lc-note{font-size:12.5px;color:var(--text-soft);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lc-actions{display:flex;gap:7px;padding:0 14px 13px;}
.btn{
  border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn.call{background:var(--sage-bg);color:var(--sage);flex:1;}
.btn.wa{background:#DFF3E3;color:#2E7D4F;flex:1;}
.btn.open{background:var(--ink);color:#fff;flex:1.4;}
.btn.ghost{background:transparent;color:var(--text-faint);padding:9px 10px;}
.btn.outline{background:var(--paper-card);border:1.5px solid var(--line);color:var(--text);}
.btn.coral{background:var(--coral);color:#fff;}
.btn.sm{padding:7px 11px;font-size:12px;}
.btn:active{transform:scale(.97);}

/* Sort/filter option lists */
.opt-list{display:flex;flex-direction:column;gap:6px;}
.opt-row{
  display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:10px;
  background:var(--paper-card);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer;
}
.opt-row.selected{border-color:var(--coral);background:var(--coral-bg);color:var(--coral-deep);}
.opt-row .check{font-size:14px;opacity:0;}
.opt-row.selected .check{opacity:1;}
.opt-chips{display:flex;flex-wrap:wrap;gap:7px;}
.opt-chip{padding:8px 13px;border-radius:99px;background:var(--paper-card);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-soft);cursor:pointer;}
.opt-chip.selected{background:var(--ink);border-color:var(--ink);color:#fff;}

/* Card kebab menu — rendered as position:fixed (not absolute inside the
   card) since .lead-card uses overflow:hidden for its rounded corners,
   which would otherwise clip a menu popping out of its bounds. */
.lc-kebab-wrap{position:relative;flex:0 0 auto;}
.btn.kebab{background:transparent;color:var(--text-faint);padding:9px 8px;font-size:16px;}
.kebab-menu{
  position:fixed;background:var(--paper-card);border-radius:12px;
  box-shadow:var(--shadow-float);border:1px solid var(--line);min-width:170px;z-index:65;
  overflow:hidden;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .12s, transform .12s;
}
.kebab-menu.show{opacity:1;pointer-events:auto;transform:translateY(0);}
.kebab-item{display:flex;align-items:center;gap:9px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text);}
.kebab-item:not(:last-child){border-bottom:1px solid var(--line-soft);}
.kebab-item.danger{color:var(--coral-deep);}
.kebab-backdrop{position:fixed;inset:0;z-index:29;display:none;}
.kebab-backdrop.show{display:block;}

.empty{text-align:center;padding:48px 20px;color:var(--text-faint);}
.empty .icon{font-size:38px;margin-bottom:10px;}
.empty .title{font-weight:700;color:var(--text-soft);margin-bottom:4px;}
.empty .desc{font-size:12.5px;}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:calc(88px + var(--safe-bottom));z-index:45;
  width:58px;height:58px;border-radius:50%;background:linear-gradient(155deg,var(--coral),var(--coral-deep));
  color:#fff;border:none;font-size:26px;box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.94);}

/* ---------- Bottom nav (2 tabs only: Queue / Board) ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:44;background:var(--paper-card);
  border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + var(--safe-bottom));
  box-shadow:0 -2px 10px rgba(15,46,43,.06);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--text-faint);}
.nav-item .ic{font-size:20px;}
.nav-item .lb{font-size:10.5px;font-weight:700;}
.nav-item.active{color:var(--coral-deep);}

/* ---------- Sheets / overlays ---------- */
.sheet-overlay{
  position:fixed;inset:0;z-index:60;background:rgba(15,33,31,.5);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .18s;
}
.sheet-overlay.active{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--paper);width:100%;max-height:92vh;border-radius:20px 20px 0 0;
  overflow-y:auto;transform:translateY(16px);transition:transform .18s;padding-bottom:calc(20px + var(--safe-bottom));
}
.sheet-overlay.active .sheet{transform:translateY(0);}
.sheet.fullscreen{max-height:100vh;height:100vh;border-radius:0;}
.sheet-head{
  position:sticky;top:0;background:var(--paper);z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + var(--safe-top)) 18px 12px;border-bottom:1px solid var(--line-soft);
}
.sheet-head h3{margin:0;font-size:17px;}
.sheet-close{background:var(--paper-dim);border:none;width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--text-soft);}
.sheet-body{padding:16px 18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14.5px;
  background:var(--paper-card);color:var(--text);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.sheet-footer{position:sticky;bottom:0;background:var(--paper);padding:12px 18px calc(14px + var(--safe-bottom));border-top:1px solid var(--line-soft);}

/* ---------- Lead detail (call desk) ---------- */
.detail-hero{background:var(--ink);color:var(--paper);padding:18px;border-radius:0 0 18px 18px;}
.detail-hero .dname{font-size:21px;font-weight:700;margin:0 0 2px;}
.detail-hero .dphone{font-size:14px;color:rgba(245,243,236,.7);}
.detail-hero .dphone a{color:#fff;text-decoration:none;}
.detail-actions{display:flex;gap:8px;margin-top:14px;}
.detail-actions .btn{flex:1;}
.stage-track{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none;}
.stage-track::-webkit-scrollbar{display:none;}
.stage-dot{
  flex:0 0 auto;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:99px;
  background:rgba(255,255,255,.08);color:rgba(245,243,236,.6);cursor:pointer;white-space:nowrap;
}
.stage-dot.active{background:var(--coral);color:#fff;}

.detail-section{padding:16px 18px 4px;}
.detail-section .lbl{font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.info-tile{background:var(--paper-card);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-card);}
.info-tile .k{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.info-tile .v{font-size:14px;font-weight:700;margin-top:2px;}

/* Call log timeline */
.timeline{margin-top:4px;}
.tl-item{display:flex;gap:11px;padding:0 0 16px;position:relative;}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:14px;top:28px;bottom:-4px;width:2px;background:var(--line);}
.tl-dot{
  flex:0 0 auto;width:29px;height:29px;border-radius:50%;background:var(--paper-card);
  border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1;
}
.tl-dot.outcome-interested{border-color:var(--coral);background:var(--coral-bg);}
.tl-dot.outcome-followup{border-color:var(--amber);background:var(--amber-bg);}
.tl-dot.outcome-converted{border-color:var(--sage);background:var(--sage-bg);}
.tl-dot.outcome-noanswer,.tl-dot.outcome-lost{border-color:var(--text-faint);background:var(--paper-dim);}
.tl-body{flex:1;background:var(--paper-card);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow-card);}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.tl-outcome{font-size:13px;font-weight:700;}
.tl-when{font-size:11px;color:var(--text-faint);white-space:nowrap;}
.tl-note{font-size:13px;color:var(--text-soft);margin-top:4px;}
.tl-empty{text-align:center;padding:24px;color:var(--text-faint);font-size:13px;}

.quicklog{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;}
.quicklog::-webkit-scrollbar{display:none;}
.qbtn{flex:0 0 auto;padding:9px 14px;border-radius:99px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:var(--paper-card);color:var(--text);}
.qbtn.rec-interested{border-color:var(--coral);color:var(--coral-deep);}
.qbtn.rec-followup{border-color:var(--amber);color:#93701F;}
.qbtn.rec-noanswer{border-color:var(--text-faint);color:var(--text-soft);}
.qbtn.rec-converted{border-color:var(--sage);color:var(--sage);}
.qbtn.rec-lost{border-color:var(--text-faint);color:var(--text-faint);}

.hidden{display:none!important;}
.mt-8{margin-top:8px;}
.toast{
  position:fixed;left:50%;bottom:calc(94px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-float);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
}
.toast.show{opacity:1;bottom:calc(104px + var(--safe-bottom));}
</style>
</head>
<body>

<!-- ===================== TOP BAR ===================== -->
<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <img src="calldesk-icon-192.png" class="brand-mark" alt="Call Desk" onerror="this.style.display='none'">
      <div class="brand-text">
        <div class="t1">Call Desk</div>
        <div class="t2">Lead calling &amp; conversion</div>
      </div>
    </div>
    <div class="db-pill" id="dbPill"><span class="dot"></span><span id="dbPillText">Connecting…</span></div>
  </div>
  <div class="today-strip">
    <div class="today-strip-head">
      <h3>Call next</h3>
      <span class="cnt" id="queueCount">0 due</span>
    </div>
    <div class="queue-row" id="queueRow"></div>
  </div>
</div>

<!-- ===================== QUEUE / LIST VIEW ===================== -->
<section id="view-list">
  <div class="page">
    <div class="page-head">

<script>
/* =========================================================
   SHARED CONFIG — same Supabase table/workspace as the main
   Loan Tracker app. This tool only ever touches DATA.leads;
   it never reads or writes cases/tasks/payouts, and every
   save is a merge against the freshest row so a caller here
   can never clobber changes another device made elsewhere.
========================================================= */
const DB_TABLE = 'loan_tracker_state';
const DB_CFG_KEY = 'ltm_db_cfg';
const DEFAULT_DB_CFG = {
  url: 'https://fxscwgwumtmsvmntkynf.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4c2N3Z3d1bXRtc3ZtbnRreW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTA2MTEsImV4cCI6MjEwMTk4NjYxMX0.ILjj_s5zohUY5HEQU_shC7teUgFKENtTCipPaNDaULw',
  workspace: 'main'
};
function loadDbConfig(){
  try{
    const raw = localStorage.getItem(DB_CFG_KEY);
    if(raw){ const p = JSON.parse(raw); if(p && !p.disabled) return p; }
  }catch(e){}
  return { ...DEFAULT_DB_CFG };
}
const DB_CFG = loadDbConfig();
let SB = null;
let DB_CONNECTED = false;
let REALTIME_CHANNEL = null;
let SAVING_REMOTE = false;

// The full shared blob, kept only so unrelated fields survive our upserts untouched.
let REMOTE_ROW = null;
let LEADS = [];             // our working copy of REMOTE_ROW.data.leads
let LOAN_TYPES = ['Personal Loan','Pension Loan','Gold Loan','Car Loan','Home Loan','Other Loan'];
const TYPE_ICON = { 'Personal Loan':'💳','Pension Loan':'🧓','Gold Loan':'🪙','Car Loan':'🚗','Home Loan':'🏠','Other Loan':'📄' };

const STAGES = [
  {key:'new',        label:'New',         icon:'🆕'},
  {key:'contacted',  label:'Contacted',   icon:'📞'},
  {key:'interested',label:'Interested',  icon:'🔥'},
  {key:'followup',   label:'Follow-up',   icon:'⏰'},
  {key:'converted',  label:'Converted',   icon:'✅'},
  {key:'lost',        label:'Lost',        icon:'✕'}
];
const OUTCOMES = [
  {key:'interested', label:'🔥 Interested',   stage:'interested'},
  {key:'followup',    label:'⏰ Call back',    stage:'followup', needsDate:true},
  {key:'noanswer',    label:'📵 No answer',    stage:null},
  {key:'converted',   label:'✅ Converted',    stage:'converted'},
  {key:'lost',        label:'✕ Not interested',stage:'lost'}
];

let STAGE_FILTER = 'active';   // active = everything except lost/converted
let CURRENT_LEAD_ID = null;
let PENDING_OUTCOME = null;

/* ---------- Sort & filter state (from the ⇅ sheet) ---------- */
const SORT_OPTIONS = [
  {key:'due',      label:'Follow-up (soonest first)'},
  {key:'recent',   label:'Recently added'},
  {key:'name',     label:'Name (A–Z)'}
];
let SORT_MODE = 'due';
let TYPE_FILTER = 'all';       // 'all' or a loan type string
let DUE_FILTER = 'all';        // 'all' | 'overdue' | 'today' | 'nodate'
let PENDING_SORT_MODE = SORT_MODE, PENDING_TYPE_FILTER = TYPE_FILTER, PENDING_DUE_FILTER = DUE_FILTER;

/* ---------- uid / date helpers ---------- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysDiff(iso){ if(!iso) return null; const a=new Date(todayISO()+'T00:00:00'); const b=new Date(iso+'T00:00:00'); return Math.round((b-a)/86400000); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d+' '+months[+m-1]+' '+y; }
function fmtWhen(iso){
  const d = new Date(iso);
  const diffMin = Math.round((Date.now()-d.getTime())/60000);
  if(diffMin < 1) return 'just now';
  if(diffMin < 60) return diffMin+'m ago';
  if(diffMin < 1440) return Math.round(diffMin/60)+'h ago';
  return fmtDate(iso.slice(0,10));
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function openSheet(id){ document.getElementById(id).classList.add('active'); }
function closeSheet(id){ document.getElementById(id).classList.remove('active'); }

/* =========================================================
   SUPABASE — read/merge/write. Every save re-fetches the
   latest row, patches only .data.leads, and writes back —
   so this site can run alongside the main LT app safely.
========================================================= */
function initSupabaseClient(){
  if(DB_CFG && DB_CFG.url && DB_CFG.anonKey && window.supabase){
    try{ SB = window.supabase.createClient(DB_CFG.url, DB_CFG.anonKey, { realtime:{ params:{ eventsPerSecond:5 } } }); }
    catch(e){ console.error('Supabase init failed', e); SB = null; }
  }
  updateDbPill();
}
function updateDbPill(){
  const pill = document.getElementById('dbPill');
  const txt = document.getElementById('dbPillText');
  if(!SB){ pill.className='db-pill'; txt.textContent='Offline'; return; }
  if(DB_CONNECTED){ pill.className='db-pill live'; txt.textContent='Live'; }
  else{ pill.className='db-pill'; txt.textContent='Connecting…'; }
}
async function loadFromSupabase(){
  if(!SB) return;
  try{
    const workspace = DB_CFG.workspace || 'main';
    const { data, error } = await SB.from(DB_TABLE).select('data').eq('id', workspace).maybeSingle();
    if(error) throw error;
    REMOTE_ROW = (data && data.data) ? data.data : { leads: [], loanTypes: LOAN_TYPES };
    if(!REMOTE_ROW.leads) REMOTE_ROW.leads = [];
    if(REMOTE_ROW.loanTypes && REMOTE_ROW.loanTypes.length) LOAN_TYPES = REMOTE_ROW.loanTypes;
    LEADS = REMOTE_ROW.leads.map(normalizeLead);
    DB_CONNECTED = true;
    subscribeRealtime();
  }catch(e){
    console.error('Load failed', e);
    DB_CONNECTED = false;
    showToast('⚠️ Could not reach the database');
  }
  updateDbPill();
}
function normalizeLead(l){
  // backward-compatible with the main app's plain leads[] shape
  // (converted:boolean, no stage/callLog) — upgrade in place.
  if(!l.callLog) l.callLog = [];
  if(!l.stage){
    l.stage = l.converted ? 'converted' : (l.followupDate ? 'followup' : 'new');
  }
  if(typeof l.converted !== 'boolean') l.converted = l.stage==='converted';
  if(!l.convertedCaseId) l.convertedCaseId = '';
  return l;
}
// Re-fetch → apply our in-memory LEADS as the truth for leads,
// merge into whatever the row now contains, write it back.
async function persistLeads(showSyncToast){
  if(!SB){ showToast('⚠️ Offline — change kept on screen only'); return; }
  try{
    const workspace = DB_CFG.workspace || 'main';
    const { data, error } = await SB.from(DB_TABLE).select('data').eq('id', workspace).maybeSingle();
    if(error) throw error;
    const latest = (data && data.data) ? data.data : { leads: [] };
    latest.leads = LEADS;                       // our module's exclusive field
    if(!latest.loanTypes || !latest.loanTypes.length) latest.loanTypes = LOAN_TYPES;
    REMOTE_ROW = latest;
    SAVING_REMOTE = true;
    const { error: upErr } = await SB.from(DB_TABLE).upsert({ id: workspace, data: latest, updated_at: new Date().toISOString() });
    if(upErr) throw upErr;
    DB_CONNECTED = true;
    if(showSyncToast) showToast('Synced');
  }catch(e){
    console.error('Save failed', e);
    DB_CONNECTED = false;
    showToast('⚠️ Saved on screen, but sync failed');
  }
  updateDbPill();
  setTimeout(()=>{ SAVING_REMOTE = false; }, 250);
}
function subscribeRealtime(){
  if(!SB) return;
  if(REALTIME_CHANNEL){ SB.removeChannel(REALTIME_CHANNEL); REALTIME_CHANNEL = null; }
  const workspace = DB_CFG.workspace || 'main';
  REALTIME_CHANNEL = SB.channel('calldesk-'+workspace)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:DB_TABLE, filter:`id=eq.${workspace}` }, (payload)=>{
      if(SAVING_REMOTE) return;
      const incoming = payload.new && payload.new.data;
      if(!incoming) return;
      REMOTE_ROW = incoming;
      const incomingLeads = (incoming.leads||[]).map(normalizeLead);
      if(JSON.stringify(incomingLeads) === JSON.stringify(LEADS)) return;
      LEADS = incomingLeads;
      if(incoming.loanTypes && incoming.loanTypes.length) LOAN_TYPES = incoming.loanTypes;
      showToast('🔄 Leads updated');
      rerender();
    })
    .subscribe(()=>{});
}

/* =========================================================
   QUEUE STRIP (top) — overdue + due-today follow-ups first

    .sort((a,b)=>(a.followupDate||'').localeCompare(b.followupDate||''));

  if(!due.length){ row.innerHTML = '<div class="queue-empty">Nothing due right now — nice and clear 👍</div>'; return; }

      <span class="qtag ${overdue?'overdue':'today'}">${overdue?'Overdue':'Today'}</span>
    </div>`;
  }).join('');
}

/* =========================================================
   STAGE RAIL + LIST
========================================================= */
function stageCounts(){
  const c = {}; STAGES.forEach(s=>c[s.key]=0);
  LEADS.forEach(l=>{ c[l.stage] = (c[l.stage]||0)+1; });
  return c;
}
function renderStageRail(){
  const c = stageCounts();
  const activeCount = LEADS.filter(l=>l.stage!=='lost' && l.stage!=='converted').length;
  const rail = document.getElementById('stageRail');
  const chips = [{key:'active', label:'Active', icon:'🎯', count:activeCount}, ...STAGES.map(s=>({...s, count:c[s.key]||0})), {key:'all', label:'All', icon:'☰', count:LEADS.length}];
  rail.innerHTML = chips.map(s=>`
    <div class="stage-chip ${STAGE_FILTER===s.key?'active':''}" onclick="setStageFilter('${s.key}')">
      <span>${s.icon}</span><span>${s.label}</span><span class="n">${s.count}</span>
    </div>`).join('');
}
function setStageFilter(k){ STAGE_FILTER = k; renderStageRail(); renderList(); }

function onSearchInput(){
  const q = document.getElementById('leadSearch').value;
  document.getElementById('searchClearBtn').classList.toggle('show', !!q);
  renderList();
}
function clearSearch(){
  document.getElementById('leadSearch').value = '';
  document.getElementById('searchClearBtn').classList.remove('show');

  renderList();

function searchScore(l, terms){
  // Rank matches: name-starts-with > name-contains > mobile-contains > type-contains.
  // Lets a caller type a first name and reliably get the right person on top
  // even with 100+ leads, rather than raw list order.
  const name = (l.name||'').toLowerCase();
  const mobile = (l.mobile||'').toLowerCase();
  const type = (l.loanType||'').toLowerCase();
  let score = 0;
  for(const t of terms){
    if(!t) continue;
    if(name.startsWith(t)) score += 100;
    else if(name.includes(t)) score += 60;
    else if(mobile.includes(t)) score += 50;
    else if(type.includes(t)) score += 20;
    else return -1; // this term matched nothing on this lead
  }
  return score;
}
function filteredLeads(){
  const raw = (document.getElementById('leadSearch').value||'').toLowerCase().trim();
  const terms = raw.split(/\s+/).filter(Boolean);
  let list = [...LEADS];

  if(STAGE_FILTER==='active') list = list.filter(l=>l.stage!=='lost' && l.stage!=='converted');
  else if(STAGE_FILTER!=='all') list = list.filter(l=>l.stage===STAGE_FILTER);
  if(TYPE_FILTER!=='all') list = list.filter(l=>l.loanType===TYPE_FILTER);
  if(DUE_FILTER!=='all'){
    const today = todayISO();
    if(DUE_FILTER==='overdue') list = list.filter(l=>l.followupDate && l.followupDate<today);
    else if(DUE_FILTER==='today') list = list.filter(l=>l.followupDate===today);
    else if(DUE_FILTER==='nodate') list = list.filter(l=>!l.followupDate);
  }

  if(terms.length){
    list = list.map(l=>({l, score:searchScore(l, terms)})).filter(x=>x.score>=0)
      .sort((a,b)=>b.score-a.score).map(x=>x.l);
  } else if(SORT_MODE==='name'){
    list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  } else if(SORT_MODE==='recent'){
    list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  } else {
    // due: overdue/due-today first (soonest first), then everything else by recency
    const today = todayISO();
    list.sort((a,b)=>{
      const aDue = a.stage!=='converted' && a.stage!=='lost' && a.followupDate && a.followupDate<=today;
      const bDue = b.stage!=='converted' && b.stage!=='lost' && b.followupDate && b.followupDate<=today;
      if(aDue !== bDue) return aDue ? -1 : 1;
      if(aDue && bDue) return (a.followupDate||'').localeCompare(b.followupDate||'');
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
  }
  return list;
}

    <div class="opt-chip ${PENDING_TYPE_FILTER===t?'selected':''}" onclick="pickType('${escapeHtml(t)}')">${t==='all'?'All types':(TYPE_ICON[t]||'')+' '+escapeHtml(t)}</div>`).join('');
  const dueOpts = [{k:'all',l:'Any'},{k:'overdue',l:'Overdue'},{k:'today',l:'Due today'},{k:'nodate',l:'No date set'}];
  document.getElementById('dueFilterChips').innerHTML = dueOpts.map(d=>`
    <div class="opt-chip ${PENDING_DUE_FILTER===d.k?'selected':''}" onclick="pickDue('${d.k}')">${d.l}</div>`).join('');
}
function pickSort(k){ PENDING_SORT_MODE = k; renderSortSheetOptions(); }
function pickType(t){ PENDING_TYPE_FILTER = t; renderSortSheetOptions(); }
function pickDue(k){ PENDING_DUE_FILTER = k; renderSortSheetOptions(); }

  SORT_MODE = PENDING_SORT_MODE; TYPE_FILTER = PENDING_TYPE_FILTER; DUE_FILTER = PENDING_DUE_FILTER;
  document.getElementById('sortTrigger').classList.toggle('active-filter', TYPE_FILTER!=='all' || DUE_FILTER!=='all');
  closeSheet('sheetSort');

}
function resetSortFilter(){
  PENDING_SORT_MODE = 'due'; PENDING_TYPE_FILTER = 'all'; PENDING_DUE_FILTER = 'all';
  renderSortSheetOptions();
}
function renderList(){
  const list = filteredLeads();
  const wrap = document.getElementById('leadsList');
  const q = (document.getElementById('leadSearch').value||'').trim();
  const hasFilters = TYPE_FILTER!=='all' || DUE_FILTER!=='all';
  const meta = document.getElementById('searchMeta');
  if(q || hasFilters){
    meta.style.display = 'block';
    meta.innerHTML = `<b>${list.length}</b> result${list.length===1?'':'s'}${q ? ` for "${escapeHtml(q)}"` : ''}`;
  } else {
    meta.style.display = 'none';
  }
  if(!list.length){
    const reason = q ? `No match for "${escapeHtml(q)}"` : 'No leads here';
    wrap.innerHTML = `<div class="empty"><div class="icon">📇</div><div class="title">${reason}</div><div class="desc">${q||hasFilters ? 'Try a different search or clear filters' : 'Tap ＋ to add a lead'}</div></div>`;
    return;
  }
  const today = todayISO();
  wrap.innerHTML = list.map(l=>{
    const overdue = l.stage!=='converted' && l.stage!=='lost' && l.followupDate && l.followupDate<today;
    const dueToday = l.stage!=='converted' && l.stage!=='lost' && l.followupDate===today;
    const stageDef = STAGES.find(s=>s.key===l.stage) || STAGES[0];
    const lastLog = l.callLog && l.callLog.length ? l.callLog[l.callLog.length-1] : null;
    return `
    <div class="lead-card st-${l.stage}">
      <div class="lead-card-body" onclick="openDetail('${l.id}')">
        <div class="lc-top">
          <div>
            <p class="lc-name">${escapeHtml(l.name)}</p>
            <div class="lc-sub mono">${escapeHtml(l.mobile)}</div>
          </div>
          <span class="stagepill st-${l.stage}">${stageDef.icon} ${stageDef.label}</span>
        </div>
        <div class="lc-meta">
          <span class="tag">${TYPE_ICON[l.loanType]||'📄'} ${escapeHtml(l.loanType||'—')}</span>
          ${l.followupDate ? `<span class="tag ${overdue||dueToday?'warn':''}">${overdue?'Overdue':dueToday?'Due today':'Next call'} · ${fmtDate(l.followupDate)}</span>` : ''}
        </div>
        ${lastLog ? `<div class="lc-note">💬 ${escapeHtml(lastLog.note || OUTCOMES.find(o=>o.key===lastLog.outcome)?.label || '')}</div>` : ''}
      </div>
      <div class="lc-actions">
        <a class="btn call" href="tel:${escapeHtml(l.mobile)}" onclick="event.stopPropagation()">📞 Call</a>
        <a class="btn wa" href="https://wa.me/91${escapeHtml((l.mobile||'').replace(/\D/g,''))}" target="_blank" onclick="event.stopPropagation()">💬 WhatsApp</a>
        <button class="btn open" onclick="openDetail('${l.id}')">Open</button>
        <div class="lc-kebab-wrap">
          <button class="btn kebab" onclick="event.stopPropagation();toggleKebab('${l.id}', this)">⋮</button>
          <div class="kebab-menu" id="kebab-${l.id}">
            <div class="kebab-item" onclick="event.stopPropagation();closeAllKebabs();openEditLeadSheet('${l.id}')">✎ Edit lead</div>
            <div class="kebab-item" onclick="event.stopPropagation();closeAllKebabs();openDetail('${l.id}')">📇 Open call desk</div>
            <div class="kebab-item danger" onclick="event.stopPropagation();closeAllKebabs();quickDelete('${l.id}')">🗑 Delete lead</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') + '<div class="kebab-backdrop" id="kebabBackdrop" onclick="closeAllKebabs()"></div>';
}
function toggleKebab(id, btnEl){
  const menu = document.getElementById('kebab-'+id);
  const backdrop = document.getElementById('kebabBackdrop');
  const isOpen = menu.classList.contains('show');
  closeAllKebabs();
  if(isOpen) return;
  const trigger = btnEl || event.currentTarget;
  const r = trigger.getBoundingClientRect();
  const menuWidth = 170;
  // Position above the trigger by default (menu height ~120px), flip
  // below if there isn't room near the top of the viewport.
  const spaceAbove = r.top;
  const openBelow = spaceAbove < 140;
  menu.style.right = 'auto';
  menu.style.left = Math.max(8, Math.min(r.right - menuWidth, window.innerWidth - menuWidth - 8)) + 'px';
  if(openBelow){ menu.style.top = (r.bottom + 6) + 'px'; menu.style.bottom = 'auto'; }
  else { menu.style.bottom = (window.innerHeight - r.top + 6) + 'px'; menu.style.top = 'auto'; }
  menu.classList.add('show');
  backdrop.classList.add('show');
}
function closeAllKebabs(){
  document.querySelectorAll('.kebab-menu.show').forEach(m=>m.classList.remove('show'));
  const backdrop = document.getElementById('kebabBackdrop');
  if(backdrop) backdrop.classList.remove('show');
}
function rerender(){ renderQueue(); renderStageRail(); renderList(); if(!document.getElementById('sheetStats').classList.contains('active')===false) renderStats(); }

/* =========================================================
   ADD / EDIT LEAD
========================================================= */
function refreshLoanTypeSelect(){
  const sel = document.getElementById('ld-loantype');
  sel.innerHTML = LOAN_TYPES.map(lt=>`<option value="${escapeHtml(lt)}">${TYPE_ICON[lt]||'📄'} ${escapeHtml(lt)}</option>`).join('');
}
function openNewLeadSheet(){
  refreshLoanTypeSelect();
  ['ld-name','ld-mobile','ld-followup','ld-remark','ld-editid'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('leadSheetTitle').textContent = 'Add Lead';
  document.getElementById('leadSheetSaveBtn').textContent = 'Add Lead';
  openSheet('sheetNewLead');
}
function openEditLeadSheet(id){
  const l = LEADS.find(x=>x.id===id);
  if(!l) return;
  refreshLoanTypeSelect();
  document.getElementById('ld-editid').value = l.id;
  document.getElementById('ld-name').value = l.name || '';
  document.getElementById('ld-mobile').value = l.mobile || '';
  document.getElementById('ld-loantype').value = l.loanType || LOAN_TYPES[0];
  document.getElementById('ld-followup').value = l.followupDate || '';
  document.getElementById('ld-remark').value = l.remark || '';
  document.getElementById('leadSheetTitle').textContent = 'Edit Lead';
  document.getElementById('leadSheetSaveBtn').textContent = 'Save Changes';
  openSheet('sheetNewLead');
}
function editCurrentLead(){ closeSheet('sheetDetail'); setTimeout(()=>openEditLeadSheet(CURRENT_LEAD_ID), 150); }
async function createLeadFromSheet(){
  const editId = document.getElementById('ld-editid').value;
  const name = document.getElementById('ld-name').value.trim();
  const mobile = document.getElementById('ld-mobile').value.trim();
  const loanType = document.getElementById('ld-loantype').value;
  const followupDate = document.getElementById('ld-followup').value;
  const remark = document.getElementById('ld-remark').value.trim();
  if(!name || !mobile){ showToast('Enter name and mobile'); return; }

  if(editId){
    const l = LEADS.find(x=>x.id===editId);
    if(l){
      Object.assign(l, {name, mobile, loanType, followupDate, remark});
      if(followupDate && (l.stage==='new' || l.stage==='contacted')) l.stage='followup';
    }
    closeSheet('sheetNewLead');
    rerender();
    showToast('Lead updated');
  } else {
    LEADS.push({
      id: uid('lead'), name, mobile, loanType, followupDate, remark,
      createdAt: new Date().toISOString(), stage:'new', converted:false, convertedCaseId:'', callLog:[]
    });
    closeSheet('sheetNewLead');
    rerender();
    showToast('Lead added: '+name);
  }
  await persistLeads(false);
}
function quickDelete(id){
  const l = LEADS.find(x=>x.id===id);
  if(!l) return;
  if(!confirm(`Remove ${l.name}?`)) return;
  LEADS = LEADS.filter(x=>x.id!==id);
  rerender();
  persistLeads(false);
  showToast('Lead removed');
}
function deleteCurrentLead(){ closeSheet('sheetDetail'); setTimeout(()=>quickDelete(CURRENT_LEAD_ID), 150); }

/* =========================================================
   DETAIL / CALL DESK VIEW
========================================================= */
function openDetail(id){
  CURRENT_LEAD_ID = id;
  renderDetail(id);
  openSheet('sheetDetail');
}
function setLeadStage(id, stage){
  const l = LEADS.find(x=>x.id===id);
  if(!l) return;
  l.stage = stage;
  l.converted = stage==='converted';
  rerender();
  if(CURRENT_LEAD_ID===id) renderDetail(id);
  persistLeads(false);
}
function renderDetail(id){
  const l = LEADS.find(x=>x.id===id);
  if(!l) return;
  const today = todayISO();
  const overdue = l.stage!=='converted' && l.stage!=='lost' && l.followupDate && l.followupDate<today;

  document.getElementById('detailHero').innerHTML = `
    <div class="detail-hero">
      <p class="dname">${escapeHtml(l.name)}</p>
      <p class="dphone">📱 <a href="tel:${escapeHtml(l.mobile)}">${escapeHtml(l.mobile)}</a></p>
      <div class="detail-actions">
        <a class="btn call" href="tel:${escapeHtml(l.mobile)}">📞 Call</a>
        <a class="btn wa" href="https://wa.me/91${escapeHtml((l.mobile||'').replace(/\D/g,''))}" target="_blank">💬 WhatsApp</a>
      </div>
      <div class="stage-track">
        ${STAGES.map(s=>`<div class="stage-dot ${l.stage===s.key?'active':''}" onclick="setLeadStage('${l.id}','${s.key}')">${s.icon} ${s.label}</div>`).join('')}
      </div>
    </div>`;

  document.getElementById('quickLogRow').innerHTML = OUTCOMES.map(o=>
    `<button class="qbtn rec-${o.key}" onclick="quickLogOutcome('${l.id}','${o.key}')">${o.label}</button>`
  ).join('');

  document.getElementById('detailInfoGrid').innerHTML = `
    <div class="info-tile"><div class="k">Loan type</div><div class="v">${TYPE_ICON[l.loanType]||'📄'} ${escapeHtml(l.loanType||'—')}</div></div>
    <div class="info-tile"><div class="k">Next follow-up</div><div class="v" style="${overdue?'color:var(--coral-deep)':''}">${l.followupDate?fmtDate(l.followupDate):'—'}</div></div>
    <div class="info-tile"><div class="k">Added</div><div class="v">${fmtDate((l.createdAt||'').slice(0,10))}</div></div>
    <div class="info-tile"><div class="k">Remark</div><div class="v" style="font-size:12.5px;font-weight:600;">${escapeHtml(l.remark||'—')}</div></div>
  `;

  const tl = document.getElementById('callTimeline');
  const log = [...(l.callLog||[])].sort((a,b)=>b.at.localeCompare(a.at));
  if(!log.length){
    tl.innerHTML = `<div class="tl-empty">No calls logged yet — use Quick log above after each call</div>`;
  } else {
    tl.innerHTML = log.map(entry=>{
      const o = OUTCOMES.find(x=>x.key===entry.outcome);
      return `<div class="tl-item">
        <div class="tl-dot outcome-${entry.outcome}">${o?o.label.split(' ')[0]:'📝'}</div>
        <div class="tl-body">
          <div class="tl-head"><span class="tl-outcome">${o?o.label:'Note'}</span><span class="tl-when">${fmtWhen(entry.at)}</span></div>
          ${entry.note ? `<div class="tl-note">${escapeHtml(entry.note)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  const convBtn = document.querySelector('#sheetDetail .btn.coral.sm');
  if(convBtn){
    if(l.convertedCaseId){ convBtn.textContent = 'Already converted ✓'; convBtn.style.opacity='.6'; convBtn.onclick=null; }
    else { convBtn.textContent = 'Convert to Case →'; convBtn.style.opacity='1'; convBtn.onclick = openConvertConfirm; }
  }
}

/* Quick-log a call outcome, with an optional follow-up date / note */
function quickLogOutcome(id, outcomeKey){
  CURRENT_LEAD_ID = id;
  PENDING_OUTCOME = outcomeKey;
  const o = OUTCOMES.find(x=>x.key===outcomeKey);
  document.getElementById('quickNoteTitle').textContent = 'Log call — ' + o.label;
  document.getElementById('qn-note').value = '';
  document.getElementById('qn-followup').value = '';
  document.getElementById('qnFollowupField').classList.toggle('hidden', !o.needsDate);
  openSheet('sheetQuickNote');
}
async function saveQuickLog(){
  const l = LEADS.find(x=>x.id===CURRENT_LEAD_ID);
  if(!l){ closeSheet('sheetQuickNote'); return; }
  const o = OUTCOMES.find(x=>x.key===PENDING_OUTCOME);
  const note = document.getElementById('qn-note').value.trim();
  const followup = document.getElementById('qn-followup').value;

  if(!l.callLog) l.callLog = [];
  l.callLog.push({ id: uid('log'), at: new Date().toISOString(), outcome: o.key, note });
  if(o.stage) l.stage = o.stage;
  if(o.needsDate && followup) l.followupDate = followup;
  l.converted = l.stage === 'converted';

  closeSheet('sheetQuickNote');
  rerender();
  if(document.getElementById('sheetDetail').classList.contains('active')) renderDetail(l.id);
  showToast('Call logged');
  await persistLeads(false);
}

/* =========================================================
   CONVERT TO CASE — integrates with the main LT module by
   writing directly into the shared cases[] array.
========================================================= */
function openConvertConfirm(){
  const l = LEADS.find(x=>x.id===CURRENT_LEAD_ID);
  if(!l) return;
  if(!confirm(`Mark "${l.name}" as converted and send to the Loan Tracker case list?`)) return;
  convertLeadToCase(l.id);
}
async function convertLeadToCase(id){
  const l = LEADS.find(x=>x.id===id);
  if(!l) return;
  if(!SB){ showToast('⚠️ Offline — cannot create case right now'); return; }
  try{
    const workspace = DB_CFG.workspace || 'main';
    const { data, error } = await SB.from(DB_TABLE).select('data').eq('id', workspace).maybeSingle();
    if(error) throw error;
    const latest = (data && data.data) ? data.data : {};
    if(!latest.cases) latest.cases = [];
    if(!latest.nextCaseSeq) latest.nextCaseSeq = 1;
    if(!latest.docMaster) latest.docMaster = ['Photo','ID Proof','Address Proof','PAN Card','Income Proof','Bank Statement','Property Papers','Loan Application Form','Guarantor Documents','Stamp Paper'];

    const seq = latest.nextCaseSeq || 1;
    const caseId = 'LN' + String(seq).padStart(4,'0');
    const newCase = {
      id: uid('case'),
      caseId,
      customerName: l.name,
      mobile: l.mobile,
      loanType: l.loanType || 'Other',
      loanAmount: '',
      sanctionDate: todayISO(),
      status: 'In Progress',
      loSign:false, bmSign:false, stamp:false,
      docs: latest.docMaster.map(name=>({ id: uid('doc'), name, status:'Pending', followupDate:'' })),
      remark: 'From lead' + (l.remark ? (': '+l.remark) : ''),
      createdAt: new Date().toISOString()
    };
    latest.cases.push(newCase);
    latest.nextCaseSeq = seq + 1;

    // finalize on our side too
    l.stage = 'converted';
    l.converted = true;
    l.convertedCaseId = newCase.id;
    if(!l.callLog) l.callLog = [];
    l.callLog.push({ id: uid('log'), at: new Date().toISOString(), outcome:'converted', note:'Converted to case '+caseId });
    latest.leads = LEADS;

    SAVING_REMOTE = true;
    const { error: upErr } = await SB.from(DB_TABLE).upsert({ id: workspace, data: latest, updated_at: new Date().toISOString() });
    if(upErr) throw upErr;
    REMOTE_ROW = latest;
    DB_CONNECTED = true;
    showToast('✅ Converted — case '+caseId+' created in Loan Tracker');
    closeSheet('sheetDetail');
    rerender();
  }catch(e){
    console.error('Convert failed', e);
    showToast('⚠️ Could not create the case — try again');
  }
  updateDbPill();
  setTimeout(()=>{ SAVING_REMOTE = false; }, 250);
}

/* =========================================================
   SUMMARY — pending vs converted MIS, matches the counts the
   main Loan Tracker's Leads MIS reports would show.
========================================================= */
function renderStats(){
  const total = LEADS.length;
  const converted = LEADS.filter(l=>l.stage==='converted').length;
  const lost = LEADS.filter(l=>l.stage==='lost').length;
  const pending = total - converted - lost;
  const overdue = LEADS.filter(l=>l.stage!=='converted' && l.stage!=='lost' && l.followupDate && l.followupDate<todayISO()).length;
  const rate = total ? Math.round((converted/total)*100) : 0;

  const body = document.getElementById('statsBody');
  body.innerHTML = `
    <div class="info-grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
      <div class="info-tile"><div class="k">Total leads</div><div class="v" style="font-size:22px;">${total}</div></div>
      <div class="info-tile"><div class="k">Conversion rate</div><div class="v" style="font-size:22px;color:var(--coral-deep);">${rate}%</div></div>
      <div class="info-tile"><div class="k">Pending</div><div class="v" style="font-size:22px;">${pending}</div></div>
      <div class="info-tile"><div class="k">Converted</div><div class="v" style="font-size:22px;color:var(--sage);">${converted}</div></div>
      <div class="info-tile"><div class="k">Overdue follow-ups</div><div class="v" style="font-size:22px;color:var(--coral-deep);">${overdue}</div></div>
      <div class="info-tile"><div class="k">Lost</div><div class="v" style="font-size:22px;color:var(--text-faint);">${lost}</div></div>
    </div>
    <div class="lbl" style="margin-bottom:10px;">By stage</div>
    ${STAGES.map(s=>{
      const n = LEADS.filter(l=>l.stage===s.key).length;
      const pct = total ? Math.round((n/total)*100) : 0;
      return `<div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px;">
          <span>${s.icon} ${s.label}</span><span>${n}</span>
        </div>
        <div style="height:8px;background:var(--paper-dim);border-radius:99px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--coral);border-radius:99px;"></div>
        </div>
      </div>`;
    }).join('')}
  `;
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  initSupabaseClient();
  await loadFromSupabase();
  rerender();
  document.getElementById('qn-followup').value = '';
  initServiceWorkerAutoUpdate();
}
document.addEventListener('DOMContentLoaded', init);

/* =========================================================
   AUTO-UPDATE — same pattern as the main Loan Tracker app:
   poll for a fresh calldesk-sw.js on open/foreground, show a
   banner when one's ready, and reload once it takes over.
========================================================= */
function initServiceWorkerAutoUpdate(){
  if(!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;

  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  navigator.serviceWorker.register('calldesk-sw.js').then((reg) => {
    if(reg.waiting) showUpdateBanner(reg);
    reg.addEventListener('updatefound', () => {
      const installing = reg.installing;
      if(!installing) return;
      installing.addEventListener('statechange', () => {
        if(installing.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner(reg);
        }
      });
    });
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') reg.update().catch(()=>{});
    });
  }).catch(()=>{});
}
function showUpdateBanner(reg){
  if(document.getElementById('swUpdateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'swUpdateBanner';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:200;background:var(--ink);color:var(--paper);padding:12px 16px calc(12px + var(--safe-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.2);font-size:13.5px;';
  bar.innerHTML = `<span>🔄 A new version is ready.</span><button style="background:var(--coral);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;">Update now</button>`;
  bar.querySelector('button').onclick = () => {
    bar.querySelector('button').textContent = 'Updating…';
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
  };
  document.body.appendChild(bar);
}
